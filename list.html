    <style>
        /* Gaya dasar tetap sama */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #f59e0b;
            --primary-light: #fbbf24;
            --primary-dark: #d97706;
            --primary-bg: #fffbeb;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-body: #fefce8;
            --card-shadow: 0 4px 16px rgba(245, 158, 11, 0.12);
            --radius: 20px;
            --radius-sm: 12px;
            --pinned-bg: #fffbeb;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); padding: 16px 12px 32px; color: var(--text-dark); min-height: 100vh; }
        .app-container { max-width: 720px; margin: 0 auto; }
        /* Gaya untuk tampilan read-only link */
        body.view-only .app-container .header,
        body.view-only .app-container .filters-panel,
        body.view-only .app-container .fab,
        body.view-only .app-container #cardsGrid,
        body.view-only .app-container .header-actions,
        body.view-only .app-container .back-btn {
            display: none !important;
        }
        body.view-only .app-container .view-only-content {
            display: block !important;
        }
        .view-only-content { display: none; padding: 20px 0; }
        .view-only-content .vo-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 16px; word-break: break-word; }
        .view-only-content .vo-body { font-size: 1rem; line-height: 1.8; color: var(--text-dark); }
        .view-only-content .vo-body ul, .view-only-content .vo-body ol { padding-left: 24px; margin: 8px 0; }
        .view-only-content .vo-body li { margin-bottom: 4px; }
        .view-only-content .vo-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
        .view-only-content .vo-labels .label-tag { background: var(--primary-bg); color: var(--primary-dark); padding: 2px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; border: 1px solid rgba(245,158,11,0.2); }
        .view-only-content .vo-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 12px; }
        .view-only-content .vo-list-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
        .view-only-content .vo-list-item .vo-check { width: 18px; text-align: center; font-size: 0.9rem; }
        .view-only-content .vo-list-item .vo-text { flex: 1; }
        .view-only-content .vo-list-item.checked .vo-text { text-decoration: line-through; color: var(--text-muted); }
        .view-only-content .vo-list-item.indent-1 { padding-left: 28px; }
        .view-only-content .vo-list-item.indent-2 { padding-left: 52px; }

        /* Modal Share */
        #shareModal .modal-content { max-width: 400px; text-align: center; }
        #shareModal .share-options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        #shareModal .share-options button { padding: 12px; border-radius: var(--radius-sm); border: 1px solid #e2e8f0; background: white; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #shareModal .share-options button:hover { background: var(--primary-bg); border-color: var(--primary); }
        #shareModal .share-options button i { font-size: 1.2rem; color: var(--primary); }

        /* Sisanya gaya dari kode sebelumnya (saya singkat agar tidak terlalu panjang, tapi tetap lengkap) */
        /* ... (semua gaya yang sudah ada sebelumnya, saya akan sisipkan di sini) ... */
        /* Karena panjang, saya akan tulis ulang secara lengkap di bawah */
    </style>

<script type="module">

    // ==================== VARIABEL GLOBAL ====================

    const closeTextViewBtn = document.getElementById('closeTextViewBtn');
    const textViewCardTitle = document.getElementById('textViewCardTitle');
    const textViewCardBody = document.getElementById('textViewCardBody');
    const textViewLabels = document.getElementById('textViewLabels');
    const textViewEditBtn = document.getElementById('textViewEditBtn');
    const textViewShareBtn = document.getElementById('textViewShareBtn');

    // ==================== UTILITY ====================
    function escapeHtml(text) { if (!text) return ''; const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
    function toastMsg(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(window.toastTimeout); window.toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000); }
    function formatDate(ts) { if (!ts) return '-'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    function formatDateShort(ts) { if (!ts) return '-'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }

    function getAllLabels() {
        const set = new Set();
        allNotes.forEach(n => (n.labels || []).forEach(l => set.add(l)));
        return [...set].sort();
    }

    function getLabelCount(label) {
        return allNotes.filter(n => (n.labels || []).includes(label)).length;
    }

    function getCardPreview(c) {
        if (c.type === 'text') {
            const raw = c.content || '';
            const stripped = raw.replace(/<[^>]*>/g, '');
            return stripped.slice(0, 80) + (stripped.length > 80 ? '...' : '');
        } else {
            const items = c.listItems || [];
            if (items.length === 0) return 'Daftar kosong';
            const shown = items.filter(it => !it.checked).slice(0, 3);
            const parts = shown.map(it => {
                const indent = '  '.repeat(it.indent || 0);
                return `${indent}• ${it.text}`;
            });
            let preview = parts.join('  ');
            const checkedCount = items.filter(it => it.checked).length;
            if (checkedCount > 0) preview += `  (+${checkedCount} selesai)`;
            if (items.length > 3) preview += '  …';
            return preview;
        }
    }

    function getCurrentListItems() {
        const rows = listItemsContainer.querySelectorAll('.list-item-row');
        const items = [];
        rows.forEach(row => {
            const id = parseInt(row.dataset.realId) || Date.now() + Math.random();
            const textEl = row.querySelector('.item-text');
            const text = textEl ? textEl.textContent || '' : '';
            const checked = row.querySelector('.item-check')?.classList.contains('checked') || false;
            const indent = parseInt(row.dataset.indent) || 0;
            items.push({ id, text, checked, indent });
        });
        return items;
    }

    function getHistoryDisplay(history) {
        if (!history || history.length === 0) return '<div style="color:var(--text-muted);">Belum ada riwayat</div>';
        return history.slice().reverse().map(h => `
            <div class="history-item">
                <span>${h.action}</span>
                <span class="h-time">${formatDate(h.timestamp)}</span>
            </div>
        `).join('');
    }

    // ==================== SHARE ====================
    function getShareText(card) {
        const title = card.title || 'Tanpa judul';
        let content = '';
        if (card.type === 'text') {
            const temp = document.createElement('div');
            temp.innerHTML = card.content || '';
            content = temp.textContent || temp.innerText || '';
        } else {
            const items = card.listItems || [];
            if (items.length === 0) {
                content = '(Daftar kosong)';
            } else {
                content = items.map(item => {
                    const check = item.checked ? '[x]' : '[ ]';
                    const indent = '  '.repeat(item.indent || 0);
                    return `${indent}${check} ${item.text}`;
                }).join('\n');
            }
        }
        return `${title}\n\n${content}`;
    }

    function openShareModal(id) {
        shareTargetId = id;
        shareModal.style.display = 'flex';
    }

    async function shareContent() {
        if (!shareTargetId) return;
        const card = allNotes.find(n => n.id === shareTargetId);
        if (!card) return;
        const text = getShareText(card);
        try {
            await navigator.clipboard.writeText(text);
            toastMsg('Konten catatan disalin!');
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            toastMsg('Konten catatan disalin!');
        }
        shareModal.style.display = 'none';
    }

    async function shareLink() {
        if (!shareTargetId) return;
        const url = new URL(window.location.href);
        url.searchParams.set('view', 'note');
        url.searchParams.set('id', shareTargetId);
        const link = url.toString();
        try {
            await navigator.clipboard.writeText(link);
            toastMsg('Link catatan disalin!');
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = link;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            toastMsg('Link catatan disalin!');
        }
        shareModal.style.display = 'none';
    }

    // ==================== VIEW-ONLY LINK HANDLER ====================
    async function handleViewOnly() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('view') === 'note' && params.get('id')) {
            const id = params.get('id');
            // Sembunyikan semua elemen normal, tampilkan view-only
            document.body.classList.add('view-only');
            // Ambil data catatan
            try {
                const docSnap = await getDoc(doc(db, 'notes', id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    voTitle.textContent = data.title || 'Tanpa judul';
                    if (data.type === 'text') {
                        voBody.innerHTML = data.content || '';
                    } else {
                        // Tampilkan daftar
                        const items = data.listItems || [];
                        if (items.length === 0) {
                            voBody.innerHTML = '<p style="color:var(--text-muted);">Daftar kosong</p>';
                        } else {
                            let html = '';
                            items.forEach(item => {
                                const indentClass = item.indent ? `indent-${item.indent}` : '';
                                const checkedClass = item.checked ? 'checked' : '';
                                const checkMark = item.checked ? '✅' : '⬜';
                                html += `
                                    <div class="vo-list-item ${indentClass} ${checkedClass}">
                                        <span class="vo-check">${checkMark}</span>
                                        <span class="vo-text">${escapeHtml(item.text)}</span>
                                    </div>
                                `;
                            });
                            voBody.innerHTML = html;
                        }
                    }
                    // Labels
                    const labels = data.labels || [];
                    voLabels.innerHTML = labels.map(l => `<span class="label-tag">${escapeHtml(l)}</span>`).join('');
                    // Meta
                    const updated = data.updatedAt ? formatDate(data.updatedAt) : '-';
                    voMeta.textContent = `Diperbarui: ${updated}`;
                } else {
                    voBody.innerHTML = '<p style="color:var(--text-muted);">Catatan tidak ditemukan.</p>';
                }
            } catch (err) {
                console.error(err);
                voBody.innerHTML = '<p style="color:var(--text-muted);">Gagal memuat catatan.</p>';
            }
        }
    }

    // ==================== PIN ====================
    async function handleTogglePin(id) {
        const card = allNotes.find(n => n.id === id);
        if (!card) return;
        const newPinned = !card.pinned;
        try {
            await updateDoc(doc(db, 'notes', id), { pinned: newPinned, updatedAt: Timestamp.now() });
            toastMsg(newPinned ? 'Catatan dipin' : 'Pin dilepas');
        } catch (err) {
            toastMsg('Gagal mengubah pin');
        }
    }

    // ==================== FIREBASE ====================
    function startNotesListener() {
        if (unsubscribeNotes) unsubscribeNotes();
        const q = query(notesCol, orderBy('updatedAt', 'desc'));
        unsubscribeNotes = onSnapshot(q, (snapshot) => {
            allNotes = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                allNotes.push({
                    id: docSnap.id,
                    ...data,
                    pinned: data.pinned || false,
                    createdAt: data.createdAt || Timestamp.now(),
                    updatedAt: data.updatedAt || Timestamp.now(),
                    history: data.history || []
                });
            });
            allLabelNames = getAllLabels();
            updateLabelFilter();
            renderCards();
        }, (error) => {
            console.error('Firestore error:', error);
            toastMsg('Gagal memuat data.');
        });
    }

    async function saveCardToFirebase(cardData) {
        const now = Timestamp.now();
        const action = cardData.id ? 'Diperbarui' : 'Dibuat';
        const historyEntry = { action, timestamp: now };
        if (cardData.id) {
            const ref = doc(db, 'notes', cardData.id);
            const existing = allNotes.find(n => n.id === cardData.id);
            const history = existing?.history || [];
            history.push(historyEntry);
            await updateDoc(ref, {
                ...cardData,
                updatedAt: now,
                history: history
            });
            return cardData.id;
        } else {
            const newDoc = {
                ...cardData,
                pinned: false,
                createdAt: now,
                updatedAt: now,
                archived: false,
                history: [historyEntry]
            };
            delete newDoc.id;
            const ref = await addDoc(notesCol, newDoc);
            return ref.id;
        }
    }

    async function deleteNoteFromFirebase(id) { await deleteDoc(doc(db, 'notes', id)); }
    async function archiveNote(id) { await updateDoc(doc(db, 'notes', id), { archived: true, updatedAt: Timestamp.now() }); }
    async function unarchiveNote(id) { await updateDoc(doc(db, 'notes', id), { archived: false, updatedAt: Timestamp.now() }); }

    // ==================== AUTO SAVE ====================
    async function autoSave() {
        if (isSaving) return;
        isSaving = true;
        try {
            const id = editId.value;
            const title = cardTitle.value.trim();
            const isNew = !id;
            if (isNew && !title && currentType === 'text' && !textContent.innerHTML.trim()) {
                isSaving = false;
                return;
            }
            if (isNew && currentType === 'list' && getCurrentListItems().length === 0) {
                isSaving = false;
                return;
            }
            let cardData = {
                type: currentType,
                title: title || 'Tanpa judul',
                color: selectedColor,
                labels: [...labels],
            };
            if (currentType === 'text') {
                cardData.content = textContent.innerHTML || '';
                cardData.listItems = [];
            } else {
                cardData.content = '';
                cardData.listItems = getCurrentListItems();
            }
            if (!isNew) cardData.id = id;
            await saveCardToFirebase(cardData);
            if (isNew) {
                const newId = cardData.id;
                editId.value = newId;
                currentEditId = newId;
            }
        } catch (err) {
            console.error(err);
            toastMsg('Gagal menyimpan otomatis');
        }
        isSaving = false;
    }

    // ==================== LABEL MANAGEMENT ====================
    function updateLabelFilter() {
        const labels = getAllLabels();
        const current = filterLabelSelect.value;
        filterLabelSelect.innerHTML = '<option value="all">Semua Label</option>';
        labels.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l;
            opt.textContent = l;
            filterLabelSelect.appendChild(opt);
        });
        if (labels.includes(current)) filterLabelSelect.value = current;
        else filterLabelSelect.value = 'all';
    }

    function renderLabelAutocomplete(query) {
        const q = query.toLowerCase().trim();
        const matches = allLabelNames.filter(l => l.toLowerCase().includes(q) && !labels.includes(l));
        if (!q || matches.length === 0) {
            labelAutocomplete.style.display = 'none';
            return;
        }
        labelAutocomplete.innerHTML = matches.map(l => `
            <div class="item" data-label="${escapeHtml(l)}">
                <span>${escapeHtml(l)}</span>
                <span class="count">${getLabelCount(l)} catatan</span>
            </div>
        `).join('');
        labelAutocomplete.style.display = 'block';
        labelAutocomplete.querySelectorAll('.item').forEach(el => {
            el.addEventListener('click', () => {
                const label = el.dataset.label;
                if (!labels.includes(label)) {
                    labels.push(label);
                    renderLabels();
                    labelInput.value = '';
                    labelAutocomplete.style.display = 'none';
                    autoSave();
                }
            });
        });
    }

    function openLabelManage() {
        const labels = getAllLabels();
        if (labels.length === 0) {
            labelManageList.innerHTML = '<div style="color:var(--text-muted);padding:12px 0;">Belum ada label. Buat label dengan menambahkannya ke catatan.</div>';
        } else {
            labelManageList.innerHTML = labels.map(l => `
                <div class="label-manage-item" data-label="${escapeHtml(l)}">
                    <div class="label-name">
                        <span>${escapeHtml(l)}</span>
                        <span class="count">${getLabelCount(l)} catatan</span>
                    </div>
                    <div class="label-actions">
                        <button class="edit-label-btn" data-label="${escapeHtml(l)}" title="Ubah nama"><i class="fas fa-edit"></i></button>
                        <button class="del-label-btn" data-label="${escapeHtml(l)}" title="Hapus label"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('');
            labelManageList.querySelectorAll('.edit-label-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const oldLabel = btn.dataset.label;
                    const newLabel = prompt('Ubah nama label:', oldLabel);
                    if (newLabel && newLabel.trim() !== oldLabel) {
                        renameLabel(oldLabel, newLabel.trim());
                    }
                });
            });
            labelManageList.querySelectorAll('.del-label-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const label = btn.dataset.label;
                    if (confirm(`Hapus label "${label}" dari semua catatan?`)) {
                        deleteLabel(label);
                    }
                });
            });
        }
        labelManageModal.style.display = 'flex';
    }

    async function renameLabel(oldLabel, newLabel) {
        if (!newLabel || newLabel === oldLabel) return;
        if (allLabelNames.includes(newLabel) && newLabel !== oldLabel) {
            toastMsg('Label sudah ada!');
            return;
        }
        try {
            const batch = [];
            allNotes.forEach(n => {
                if ((n.labels || []).includes(oldLabel)) {
                    const newLabels = n.labels.map(l => l === oldLabel ? newLabel : l);
                    batch.push({ id: n.id, labels: newLabels });
                }
            });
            for (const item of batch) {
                await updateDoc(doc(db, 'notes', item.id), { labels: item.labels, updatedAt: Timestamp.now() });
            }
            toastMsg(`Label "${oldLabel}" diubah menjadi "${newLabel}"`);
            labelManageModal.style.display = 'none';
        } catch (err) {
            toastMsg('Gagal mengubah label');
        }
    }

    async function deleteLabel(label) {
        try {
            const batch = [];
            allNotes.forEach(n => {
                if ((n.labels || []).includes(label)) {
                    const newLabels = n.labels.filter(l => l !== label);
                    batch.push({ id: n.id, labels: newLabels });
                }
            });
            for (const item of batch) {
                await updateDoc(doc(db, 'notes', item.id), { labels: item.labels, updatedAt: Timestamp.now() });
            }
            toastMsg(`Label "${label}" dihapus`);
            labelManageModal.style.display = 'none';
        } catch (err) {
            toastMsg('Gagal menghapus label');
        }
    }

    // ==================== FILTERS & SORT ====================
    function getActiveCards() {
        const pool = isArchivedView ? allNotes.filter(c => c.archived === true) : allNotes.filter(c => c.archived !== true);
        let filtered = pool.filter(c => {
            if (filterType !== 'all' && c.type !== filterType) return false;
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                const titleMatch = (c.title || '').toLowerCase().includes(q);
                const contentMatch = (c.content || '').toLowerCase().includes(q);
                const labelMatch = (c.labels || []).some(l => l.toLowerCase().includes(q));
                const itemMatch = (c.listItems || []).some(it => it.text.toLowerCase().includes(q));
                return titleMatch || contentMatch || labelMatch || itemMatch;
            }
            if (filterLabel !== 'all' && !(c.labels || []).includes(filterLabel)) return false;
            if (filterDate !== 'all') {
                const now = new Date();
                const d = c.updatedAt?.toDate?.() || new Date(c.updatedAt);
                if (filterDate === 'today') {
                    if (d.toDateString() !== now.toDateString()) return false;
                } else if (filterDate === 'week') {
                    const start = new Date(now); start.setDate(now.getDate() - now.getDay());
                    const end = new Date(start); end.setDate(start.getDate() + 6);
                    if (d < start || d > end) return false;
                } else if (filterDate === 'month') {
                    if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return false;
                }
            }
            return true;
        });
        return filtered.sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            const da = a.updatedAt?.toDate?.()?.getTime() || 0;
            const db2 = b.updatedAt?.toDate?.()?.getTime() || 0;
            return db2 - da;
        });
    }

    // ==================== RENDER ====================
    function renderCards() {
        const cards = getActiveCards();
        if (cards.length === 0) {
            const msg = isArchivedView ? 'Tidak ada catatan diarsipkan.' : 'Belum ada catatan. Klik + untuk membuat!';
            cardsGrid.innerHTML = `<div class="card-empty"><i class="fas ${isArchivedView ? 'fa-archive' : 'fa-pen'}"></i>${msg}</div>`;
            return;
        }
        cardsGrid.innerHTML = cards.map(c => {
            const preview = getCardPreview(c);
            const labelHtml = (c.labels || []).map(l => `<span class="label-tag">${escapeHtml(l)}</span>`).join('');
            const isArchived = c.archived === true;
            const itemCount = c.type === 'list' ? (c.listItems || []).length : 0;
            const checkedCount = c.type === 'list' ? (c.listItems || []).filter(it => it.checked).length : 0;
            const color = c.color || '#f59e0b';
            const pinnedClass = c.pinned ? 'pinned' : '';
            const pinIcon = c.pinned ? 'fas fa-thumbtack' : 'far fa-thumbtack';
            const pinTitle = c.pinned ? 'Lepas pin' : 'Pin';
            return `
                <div class="card-item ${pinnedClass}" data-id="${c.id}" style="border-left-color:${color};">
                    <div class="card-color-bar" style="background:${color};"></div>
                    <div class="card-actions-top">
                        ${isArchived ? `<button class="unarchive-btn" data-id="${c.id}" title="Pulihkan"><i class="fas fa-undo"></i></button>` : ''}
                        <button class="pin-btn ${c.pinned ? 'pinned' : ''}" data-id="${c.id}" title="${pinTitle}"><i class="${pinIcon}"></i></button>
                        <button class="share-btn" data-id="${c.id}" title="Bagikan"><i class="fas fa-share-alt"></i></button>
                        <button class="history-btn" data-id="${c.id}" title="Riwayat"><i class="fas fa-history"></i></button>
                        <button class="del-btn" data-id="${c.id}" title="Hapus"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="card-title">${escapeHtml(c.title || 'Tanpa judul')}</div>
                    <div class="card-preview">${preview}</div>
                    <div class="card-labels">${labelHtml}</div>
                    <div class="card-meta">
                        <span>
                            ${c.type === 'list' ? `<span class="item-count-badge"><i class="fas fa-list"></i> ${itemCount} item${checkedCount > 0 ? ` (${checkedCount} ✓)` : ''}</span>` : ''}
                            ${isArchived ? `<span class="card-badge-archived"><i class="fas fa-archive"></i> Arsip</span>` : ''}
                            ${c.pinned ? `<span class="card-badge-archived" style="background:var(--primary-bg);color:var(--primary-dark);"><i class="fas fa-thumbtack"></i> Pin</span>` : ''}
                        </span>
                        <span style="font-size:0.6rem;">${formatDateShort(c.updatedAt)}</span>
                    </div>
                </div>
            `;
        }).join('');

        // Event listener untuk kartu
        cardsGrid.querySelectorAll('.card-item').forEach(el => {
            const id = el.dataset.id;
            el.addEventListener('click', (e) => {
                if (e.target.closest('.card-actions-top')) return;
                const card = allNotes.find(n => n.id === id);
                if (card) {
                    if (card.type === 'text') {
                        openTextView(id);
                    } else {
                        openEditor(id);
                    }
                }
            });
        });

        // Tombol pin, share, hapus, dll.
        cardsGrid.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                await handleTogglePin(id);
            });
        });

        cardsGrid.querySelectorAll('.share-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                openShareModal(id);
            });
        });

        cardsGrid.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                if (confirm('Hapus catatan ini?')) {
                    try { await deleteNoteFromFirebase(id); toastMsg('Catatan dihapus'); } catch (err) { toastMsg('Gagal menghapus'); }
                }
            });
        });

        cardsGrid.querySelectorAll('.unarchive-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                try { await unarchiveNote(id); toastMsg('Catatan dipulihkan'); } catch (err) { toastMsg('Gagal memulihkan'); }
            });
        });

        cardsGrid.querySelectorAll('.history-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                const card = allNotes.find(n => n.id === id);
                if (card) showHistory(card);
            });
        });
    }

    // ==================== TEXT VIEW ====================
    function openTextView(id) {
        const card = allNotes.find(n => n.id === id);
        if (!card || card.type !== 'text') return;
        currentTextViewId = id;
        currentFontSize = parseInt(localStorage.getItem(`fontSize_${id}`)) || 16;
        textViewCardTitle.textContent = card.title || 'Tanpa judul';
        textViewCardBody.innerHTML = card.content || '';
        textViewCardBody.style.fontSize = currentFontSize + 'px';
        fontSizeDisplay.textContent = currentFontSize;

        const labels = card.labels || [];
        textViewLabels.innerHTML = labels.map(l => `<span class="label-tag">${escapeHtml(l)}</span>`).join('');

        const isPinned = card.pinned || false;
        textViewPinBtn.innerHTML = `<i class="${isPinned ? 'fas' : 'far'} fa-thumbtack"></i> ${isPinned ? 'Lepas Pin' : 'Pin'}`;
        textViewPinBtn.classList.toggle('pinned', isPinned);

        textViewModal.style.display = 'flex';
        document.querySelector('#textViewModal h2').textContent = card.title || 'Catatan';
    }

    function closeTextViewModal() {
        textViewModal.style.display = 'none';
        currentTextViewId = null;
    }

    function adjustFontSize(delta) {
        currentFontSize = Math.min(28, Math.max(12, currentFontSize + delta));
        textViewCardBody.style.fontSize = currentFontSize + 'px';
        fontSizeDisplay.textContent = currentFontSize;
        if (currentTextViewId) {
            localStorage.setItem(`fontSize_${currentTextViewId}`, currentFontSize);
        }
    }

    // ==================== HISTORY ====================
    function showHistory(card) {
        historyList.innerHTML = getHistoryDisplay(card.history || []);
        historyModal.style.display = 'flex';
    }

    // ==================== RICH TEXT EDITOR ====================
    function execCommand(cmd, value = null) {
        document.execCommand(cmd, false, value);
        textContent.focus();
        autoSave();
    }

    // ==================== EDITOR ====================
    function openEditor(id = null) {
        currentEditId = id;
        labels = [];
        if (id !== null) {
            const card = allNotes.find(c => c.id === id);
            if (!card) return;
            choiceSection.style.display = 'none';
            editorFields.style.display = 'block';
            editorTitle.textContent = 'Edit Catatan';
            editId.value = id;
            cardTitle.value = card.title || '';
            selectedColor = card.color || '#f59e0b';
            labels = [...(card.labels || [])];
            currentType = card.type || 'text';
            document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('active', el.dataset.color === selectedColor));
            if (currentType === 'text') {
                textEditor.style.display = 'block';
                listEditor.style.display = 'none';
                textContent.innerHTML = card.content || '';
            } else {
                textEditor.style.display = 'none';
                listEditor.style.display = 'block';
                renderListItems(card.listItems || []);
            }
            renderLabels();
            updateModalButtons(card);
            editorModal.style.display = 'flex';
            if (currentType === 'text') textContent.focus();
        } else {
            choiceSection.style.display = 'block';
            editorFields.style.display = 'none';
            editorTitle.textContent = 'Catatan Baru';
            editId.value = '';
            cardTitle.value = '';
            textContent.innerHTML = '';
            currentType = 'text';
            selectedColor = '#f59e0b';
            labels = [];
            document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('active', el.dataset.color === selectedColor));
            renderLabels();
            deleteCardBtn.style.display = 'none';
            archiveCardBtn.style.display = 'none';
            unarchiveCardBtn.style.display = 'none';
            editorModal.style.display = 'flex';
        }
    }

    function closeEditorModal() {
        editorModal.style.display = 'none';
        choiceSection.style.display = 'block';
        editorFields.style.display = 'none';
        labelAutocomplete.style.display = 'none';
    }

    function renderLabels() {
        labelTagsDisplay.innerHTML = labels.map(l =>
            `<span class="label-tag">${escapeHtml(l)} <span class="remove-label" data-label="${escapeHtml(l)}">&times;</span></span>`
        ).join('');
        labelTagsDisplay.querySelectorAll('.remove-label').forEach(el => {
            el.addEventListener('click', () => {
                labels = labels.filter(l => l !== el.dataset.label);
                renderLabels();
                autoSave();
            });
        });
    }

    function updateModalButtons(card) {
        const isArchived = card.archived === true;
        deleteCardBtn.style.display = 'inline-flex';
        if (isArchived) {
            archiveCardBtn.style.display = 'none';
            unarchiveCardBtn.style.display = 'inline-flex';
        } else {
            archiveCardBtn.style.display = 'inline-flex';
            unarchiveCardBtn.style.display = 'none';
        }
    }

    // ==================== LIST ITEMS ====================
    function renderListItems(items) {
        if (!items || items.length === 0) {
            listItemsContainer.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.8rem;">Belum ada item.</div>`;
            return;
        }
        const unchecked = items.filter(it => !it.checked);
        const checked = items.filter(it => it.checked);
        const sorted = [...unchecked, ...checked];
        listItemsContainer.innerHTML = sorted.map((item, idx) => {
            const indentClass = item.indent ? `indent-${item.indent}` : '';
            const checkedClass = item.checked ? 'checked-item' : '';
            const isChecked = item.checked ? 'checked' : '';
            const displayText = escapeHtml(item.text) || ' ';
            return `
                <div class="list-item-row ${indentClass} ${checkedClass}" draggable="true" data-idx="${idx}" data-real-id="${item.id || idx}" data-indent="${item.indent || 0}">
                    <span class="drag-handle"><i class="fas fa-grip-lines"></i></span>
                    <div class="item-check ${isChecked}" data-idx="${idx}"></div>
                    <div class="item-text" contenteditable="true" data-idx="${idx}">${displayText}</div>
                    <div class="item-indent">
                        <button class="indent-left" data-idx="${idx}" title="Kurangi indent"><i class="fas fa-outdent"></i></button>
                        <button class="indent-right" data-idx="${idx}" title="Tambah indent"><i class="fas fa-indent"></i></button>
                    </div>
                    <span class="item-del" data-idx="${idx}"><i class="fas fa-times"></i></span>
                </div>
            `;
        }).join('');

        // Event-item sama seperti sebelumnya (check, delete, indent, edit, enter)
        listItemsContainer.querySelectorAll('.item-check').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                toggleItemCheck(idx);
            });
        });
        listItemsContainer.querySelectorAll('.item-del').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                deleteItem(idx);
            });
        });
        listItemsContainer.querySelectorAll('.indent-left').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                changeIndent(idx, -1);
            });
        });
        listItemsContainer.querySelectorAll('.indent-right').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                changeIndent(idx, 1);
            });
        });
        listItemsContainer.querySelectorAll('.item-text').forEach(el => {
            el.addEventListener('blur', () => {
                const idx = parseInt(el.dataset.idx);
                const newText = el.textContent || '';
                updateItemText(idx, newText);
            });
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const idx = parseInt(el.dataset.idx);
                    const items = getCurrentListItems();
                    const currentItem = items[idx];
                    if (!currentItem) return;
                    const newItem = {
                        id: Date.now() + Math.random(),
                        text: '',
                        checked: false,
                        indent: currentItem.indent || 0
                    };
                    items.splice(idx + 1, 0, newItem);
                    renderListItems(items);
                    setTimeout(() => {
                        const newRows = listItemsContainer.querySelectorAll('.list-item-row');
                        if (newRows[idx + 1]) {
                            const textEl = newRows[idx + 1].querySelector('.item-text');
                            if (textEl) {
                                textEl.focus();
                                const range = document.createRange();
                                range.selectNodeContents(textEl);
                                const sel = window.getSelection();
                                sel.removeAllRanges();
                                sel.addRange(range);
                            }
                        }
                    }, 50);
                    autoSave();
                }
            });
        });
        // Drag & Drop
        listItemsContainer.querySelectorAll('.list-item-row').forEach(row => {
            row.addEventListener('dragstart', handleDragStart);
            row.addEventListener('dragend', handleDragEnd);
            row.addEventListener('dragover', handleDragOver);
            row.addEventListener('dragenter', handleDragEnter);
            row.addEventListener('dragleave', handleDragLeave);
            row.addEventListener('drop', handleDrop);
        });
    }

    function toggleItemCheck(idx) {
        const rows = listItemsContainer.querySelectorAll('.list-item-row');
        if (idx >= rows.length) return;
        const row = rows[idx];
        const check = row.querySelector('.item-check');
        check.classList.toggle('checked');
        row.classList.toggle('checked-item');
        const items = getCurrentListItems();
        const unchecked = items.filter(it => !it.checked);
        const checkedItems = items.filter(it => it.checked);
        const sorted = [...unchecked, ...checkedItems];
        renderListItems(sorted);
        autoSave();
    }

    function deleteItem(idx) {
        const items = getCurrentListItems();
        items.splice(idx, 1);
        renderListItems(items);
        autoSave();
    }

    function changeIndent(idx, delta) {
        const items = getCurrentListItems();
        if (idx >= items.length) return;
        const newIndent = Math.min(2, Math.max(0, (items[idx].indent || 0) + delta));
        items[idx].indent = newIndent;
        renderListItems(items);
        autoSave();
    }

    function updateItemText(idx, newText) {
        const items = getCurrentListItems();
        if (idx >= items.length) return;
        items[idx].text = newText;
        autoSave();
    }

    function addNewItem() {
        const text = newItemInput.value.trim();
        if (!text) return;
        const items = getCurrentListItems();
        items.push({ id: Date.now() + Math.random(), text, checked: false, indent: 0 });
        renderListItems(items);
        newItemInput.value = '';
        autoSave();
    }

    // ==================== DRAG & DROP ====================
    function handleDragStart(e) {
        const row = e.target.closest('.list-item-row');
        if (!row) return;
        dragItem = row;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', row.innerHTML);
    }
    function handleDragEnd(e) {
        const row = e.target.closest('.list-item-row');
        if (row) row.classList.remove('dragging');
        document.querySelectorAll('.list-item-row').forEach(r => r.style.borderTop = '');
        dragItem = null;
        dragOverItem = null;
    }
    function handleDragOver(e) { e.preventDefault();
        e.dataTransfer.dropEffect = 'move'; }
    function handleDragEnter(e) {
        e.preventDefault();
        const row = e.target.closest('.list-item-row');
        if (row && row !== dragItem) { row.style.borderTop = '2px solid var(--primary)';
            dragOverItem = row; }
    }
    function handleDragLeave(e) { const row = e.target.closest('.list-item-row'); if (row) row.style.borderTop = ''; }
    function handleDrop(e) {
        e.preventDefault();
        const row = e.target.closest('.list-item-row');
        if (row) row.style.borderTop = '';
        if (!dragItem || !dragOverItem || dragItem === dragOverItem) return;
        const rows = listItemsContainer.querySelectorAll('.list-item-row');
        const fromIdx = Array.from(rows).indexOf(dragItem);
        const toIdx = Array.from(rows).indexOf(dragOverItem);
        if (fromIdx === -1 || toIdx === -1) return;
        const items = getCurrentListItems();
        const [moved] = items.splice(fromIdx, 1);
        items.splice(toIdx, 0, moved);
        renderListItems(items);
        autoSave();
        dragItem = null;
        dragOverItem = null;
    }

    // ==================== DELETE / ARCHIVE ====================
    async function deleteCard() {
        const id = editId.value;
        if (!id) return;
        if (confirm('Hapus catatan ini?')) {
            try { await deleteNoteFromFirebase(id);
                toastMsg('Catatan dihapus');
                closeEditorModal(); } catch (err) { toastMsg('Gagal menghapus'); }
        }
    }
    async function archiveCard() {
        const id = editId.value;
        if (!id) return;
        try { await archiveNote(id);
            toastMsg('Catatan diarsipkan');
            closeEditorModal(); } catch (err) { toastMsg('Gagal mengarsip'); }
    }
    async function unarchiveCard() {
        const id = editId.value;
        if (!id) return;
        try { await unarchiveNote(id);
            toastMsg('Catatan dipulihkan');
            closeEditorModal(); } catch (err) { toastMsg('Gagal memulihkan'); }
    }

    // ==================== EVENT BINDING ====================
    function init() {
        // Cek view-only link
        handleViewOnly();

        startNotesListener();

        backBtn.addEventListener('click', () => { window.location.href = 'index.html'; });
        fabAdd.addEventListener('click', () => openEditor(null));
        addCardBtn.addEventListener('click', () => openEditor(null));

        closeEditor.addEventListener('click', closeEditorModal);
        closeEditorBtn.addEventListener('click', closeEditorModal);
        editorModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEditorModal(); });

        manageLabelBtn.addEventListener('click', openLabelManage);
        closeLabelManage.addEventListener('click', () => labelManageModal.style.display = 'none');
        closeLabelManageBtn.addEventListener('click', () => labelManageModal.style.display = 'none');
        labelManageModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) labelManageModal.style.display = 'none'; });

        document.querySelectorAll('.choice-card').forEach(el => {
            el.addEventListener('click', () => {
                currentType = el.dataset.type;
                choiceSection.style.display = 'none';
                editorFields.style.display = 'block';
                editorTitle.textContent = 'Catatan Baru';
                textEditor.style.display = currentType === 'text' ? 'block' : 'none';
                listEditor.style.display = currentType === 'list' ? 'block' : 'none';
                if (currentType === 'list') renderListItems([]);
                selectedColor = '#f59e0b';
                document.querySelectorAll('.color-option').forEach(el2 => el2.classList.toggle('active', el2.dataset.color === selectedColor));
                labels = [];
                renderLabels();
                deleteCardBtn.style.display = 'none';
                archiveCardBtn.style.display = 'none';
                unarchiveCardBtn.style.display = 'none';
                if (currentType === 'text') setTimeout(() => textContent.focus(), 100);
            });
        });

        deleteCardBtn.addEventListener('click', deleteCard);
        archiveCardBtn.addEventListener('click', archiveCard);
        unarchiveCardBtn.addEventListener('click', unarchiveCard);

        addItemBtn.addEventListener('click', addNewItem);
        newItemInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                addNewItem(); } });

        addLabelBtn.addEventListener('click', () => {
            const val = labelInput.value.trim();
            if (val && !labels.includes(val)) {
                labels.push(val);
                renderLabels();
                labelInput.value = '';
                labelAutocomplete.style.display = 'none';
                autoSave();
            }
        });

        document.querySelectorAll('.color-option').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                selectedColor = el.dataset.color;
                autoSave();
            });
        });

        cardTitle.addEventListener('input', autoSave);
        textContent.addEventListener('input', autoSave);

        // Event untuk text view
        closeTextView.addEventListener('click', closeTextViewModal);
        closeTextViewBtn.addEventListener('click', closeTextViewModal);
        textViewModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTextViewModal(); });

        textViewEditBtn.addEventListener('click', () => {
            const id = currentTextViewId;
            if (id) {
                closeTextViewModal();
                openEditor(id);
            }
        });

        textViewShareBtn.addEventListener('click', () => {
            if (currentTextViewId) openShareModal(currentTextViewId);
        });

        textViewPinBtn.addEventListener('click', async () => {
            if (currentTextViewId) {
                await handleTogglePin(currentTextViewId);
                const card = allNotes.find(n => n.id === currentTextViewId);
                if (card) {
                    const isPinned = card.pinned || false;
                    textViewPinBtn.innerHTML = `<i class="${isPinned ? 'fas' : 'far'} fa-thumbtack"></i> ${isPinned ? 'Lepas Pin' : 'Pin'}`;
                    textViewPinBtn.classList.toggle('pinned', isPinned);
                }
            }
        });

        fontDecrease.addEventListener('click', () => adjustFontSize(-2));
        fontIncrease.addEventListener('click', () => adjustFontSize(2));

        // Share modal events
        closeShareModal.addEventListener('click', () => shareModal.style.display = 'none');
        closeShareModalBtn.addEventListener('click', () => shareModal.style.display = 'none');
        shareModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) shareModal.style.display = 'none'; });
        shareContentBtn.addEventListener('click', shareContent);
        shareLinkBtn.addEventListener('click', shareLink);

        // History
        closeHistory.addEventListener('click', () => historyModal.style.display = 'none');
        closeHistoryBtn.addEventListener('click', () => historyModal.style.display = 'none');
        historyModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) historyModal.style.display = 'none'; });

        // Filter
        searchInput.addEventListener('input', () => { searchQuery = searchInput.value;
            renderCards(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterType = btn.dataset.filter;
                renderCards();
            });
        });
        filterLabelSelect.addEventListener('change', () => { filterLabel = filterLabelSelect.value;
            renderCards(); });
        filterDateSelect.addEventListener('change', () => { filterDate = filterDateSelect.value;
            renderCards(); });

        viewArchivedBtn.addEventListener('click', () => {
            isArchivedView = !isArchivedView;
            viewArchivedBtn.innerHTML = isArchivedView ? '<i class="fas fa-arrow-left"></i> Kembali' :
                '<i class="fas fa-archive"></i> Arsip';
            viewArchivedBtn.classList.toggle('primary', isArchivedView);
            renderCards();
            if (isArchivedView) toastMsg('Menampilkan arsip');
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') {
                closeEditorModal();
                closeTextViewModal();
                shareModal.style.display = 'none';
            } });

        // Bold, italic, dll. (sama)
        boldBtn.addEventListener('click', () => execCommand('bold'));
        italicBtn.addEventListener('click', () => execCommand('italic'));
        bulletBtn.addEventListener('click', () => execCommand('insertUnorderedList'));
        numberBtn.addEventListener('click', () => execCommand('insertOrderedList'));
        indentBtn.addEventListener('click', () => execCommand('indent'));
        outdentBtn.addEventListener('click', () => execCommand('outdent'));

        textContent.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'b') { e.preventDefault(); execCommand('bold'); }
            else if (e.ctrlKey && e.key === 'i') { e.preventDefault(); execCommand('italic'); }
            else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); execCommand('indent'); }
            else if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); execCommand('outdent'); }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
